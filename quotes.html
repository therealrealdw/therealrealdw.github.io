<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quotes — David Wei</title>
<meta name="description" content="Lines worth keeping.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..500;1,6..72,300..500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper:    #f7f7f5;
    --ink:      #17181b;
    --ink-soft: #6a6d73;
    --rule:     #e2e2de;
    --accent:   #2f4f7f;
    --measure:  34rem;
    --serif: "Newsreader", Georgia, "Times New Roman", serif;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --paper:    #111214;
      --ink:      #e7e7e3;
      --ink-soft: #8b8f95;
      --rule:     #272a2d;
      --accent:   #97b4dd;
    }
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--serif);
    font-optical-sizing: auto;
    font-size: clamp(1rem, 0.97rem + 0.2vw, 1.125rem);
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  .page {
    max-width: var(--measure);
    margin: 0 auto;
    padding: clamp(3.5rem, 11vh, 8rem) 1.5rem clamp(4rem, 12vh, 8rem);
  }

  .nav {
    display: flex;
    flex-wrap: wrap;
    gap: 1.4rem;
    margin-bottom: clamp(3rem, 8vh, 5rem);
    font-style: italic;
    font-size: 0.95em;
  }

  .nav a {
    color: var(--ink-soft);
    text-decoration: none;
    transition: color 120ms ease;
  }

  .nav a:hover,
  .nav a:focus-visible { color: var(--ink); }

  .nav a[aria-current="page"] {
    color: var(--ink);
    text-decoration: underline;
    text-decoration-thickness: 0.05em;
    text-underline-offset: 0.28em;
  }

  h1 {
    margin: 0 0 2.75rem;
    font-size: clamp(1.75rem, 1.4rem + 1.5vw, 2.35rem);
    font-weight: 400;
    letter-spacing: -0.015em;
    line-height: 1.15;
  }

  /* --- quotes ----------------------------------------------------- */

  figure {
    margin: 0;
    padding: 0 0 2.25rem;
    border-bottom: 1px solid var(--rule);
  }

  figure + figure { padding-top: 2.25rem; }

  blockquote {
    margin: 0 0 0.9rem;
    font-size: 1.08em;
    line-height: 1.55;
    text-wrap: pretty;
  }

  figcaption {
    font-family: var(--mono);
    font-size: 0.7rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  figcaption .work {
    text-transform: none;
    letter-spacing: 0.02em;
    font-family: var(--serif);
    font-style: italic;
    font-size: 0.95rem;
  }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 4px;
    border-radius: 1px;
  }

  .reveal {
    opacity: 0;
    transform: translateY(0.5rem);
    animation: rise 700ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }

  .reveal:nth-child(1) { animation-delay: 40ms; }
  .reveal:nth-child(2) { animation-delay: 140ms; }
  .reveal:nth-child(3) { animation-delay: 240ms; }

  @keyframes rise { to { opacity: 1; transform: none; } }

  @media (prefers-reduced-motion: reduce) {
    .reveal { animation: none; opacity: 1; transform: none; }
    * { transition-duration: 0.01ms !important; }
  }
</style>
</head>
<body>
<main class="page">

  <nav class="nav reveal">
    <a href="/">about</a>
    <a href="/quotes" aria-current="page">quotes</a>
    <a href="/projects">projects</a>
    <a href="/writing">writing</a>
    <a href="/podcast">podcast</a>
  </nav>

  <h1 class="reveal">Quotes</h1>

  <div class="reveal">

    <figure>
      <blockquote>Replace the placeholder text with the line itself. Keep it to the sentence that actually earned its place — a quote page dies the moment it turns into paragraphs.</blockquote>
      <figcaption>Author Name — <span class="work">Title of the Work</span>, 1987</figcaption>
    </figure>

    <figure>
      <blockquote>A second entry, to show the spacing between them. Attribution sits in small mono caps so the eye reads the line first and the source second.</blockquote>
      <figcaption>Author Name — <span class="work">Title of the Work</span></figcaption>
    </figure>

    <figure>
      <blockquote>Short ones work best here.</blockquote>
      <figcaption>Author Name</figcaption>
    </figure>

  </div>

</main>
</body>
</html>
