<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Writing — David Wei</title>
<meta name="description" content="Essays and working notes.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..500;1,6..72,300..500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper:    #f7f7f5;
    --ink:      #17181b;
    --ink-soft: #6a6d73;
    --rule:     #e2e2de;
    --accent:   #2f4f7f;
    --measure:  34rem;
    --serif: "Newsreader", Georgia, "Times New Roman", serif;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --paper:    #111214;
      --ink:      #e7e7e3;
      --ink-soft: #8b8f95;
      --rule:     #272a2d;
      --accent:   #97b4dd;
    }
  }

  *, *::before, *::after { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--serif);
    font-optical-sizing: auto;
    font-size: clamp(1rem, 0.97rem + 0.2vw, 1.125rem);
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  .page {
    max-width: var(--measure);
    margin: 0 auto;
    padding: clamp(3.5rem, 11vh, 8rem) 1.5rem clamp(4rem, 12vh, 8rem);
  }

  .nav {
    display: flex;
    flex-wrap: wrap;
    gap: 1.4rem;
    margin-bottom: clamp(3rem, 8vh, 5rem);
    font-style: italic;
    font-size: 0.95em;
  }

  .nav a {
    color: var(--ink-soft);
    text-decoration: none;
    transition: color 120ms ease;
  }

  .nav a:hover,
  .nav a:focus-visible { color: var(--ink); }

  .nav a[aria-current="page"] {
    color: var(--ink);
    text-decoration: underline;
    text-decoration-thickness: 0.05em;
    text-underline-offset: 0.28em;
  }

  h1 {
    margin: 0 0 2.5rem;
    font-size: clamp(1.75rem, 1.4rem + 1.5vw, 2.35rem);
    font-weight: 400;
    letter-spacing: -0.015em;
    line-height: 1.15;
  }

  /* --- post list -------------------------------------------------- */

  .posts { border-top: 1px solid var(--rule); }

  .post {
    display: flex;
    align-items: baseline;
    gap: 1.25rem;
    padding: 1rem 0;
    border-bottom: 1px solid var(--rule);
    text-decoration: none;
    color: inherit;
  }

  .post time {
    flex: 0 0 5.5rem;
    font-family: var(--mono);
    font-size: 0.7rem;
    letter-spacing: 0.06em;
    color: var(--ink-soft);
    text-transform: uppercase;
  }

  .post .title {
    text-decoration: underline;
    text-decoration-color: transparent;
    text-decoration-thickness: 0.055em;
    text-underline-offset: 0.18em;
    transition: text-decoration-color 140ms ease;
  }

  .post:hover .title,
  .post:focus-visible .title { text-decoration-color: var(--accent); }

  @media (max-width: 30rem) {
    .post { flex-direction: column; gap: 0.3rem; }
    .post time { flex: none; }
  }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 4px;
    border-radius: 1px;
  }

  .reveal {
    opacity: 0;
    transform: translateY(0.5rem);
    animation: rise 700ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }

  .reveal:nth-child(1) { animation-delay: 40ms; }
  .reveal:nth-child(2) { animation-delay: 140ms; }
  .reveal:nth-child(3) { animation-delay: 240ms; }

  @keyframes rise { to { opacity: 1; transform: none; } }

  @media (prefers-reduced-motion: reduce) {
    .reveal { animation: none; opacity: 1; transform: none; }
    * { transition-duration: 0.01ms !important; }
  }
</style>
</head>
<body>
<main class="page">

  <nav class="nav reveal">
    <a href="/">about</a>
    <a href="/quotes">quotes</a>
    <a href="/projects">projects</a>
    <a href="/writing" aria-current="page">writing</a>
    <a href="/podcast">podcast</a>
  </nav>

  <h1 class="reveal">Writing</h1>

  <div class="posts reveal">
    <a class="post" href="/writing/11">
      <time datetime="2021-09-14">Sep 2021</time>
      <span class="title">Swooping in The Name of Parental Love</span>
    </a>
    <a class="post" href="/writing/10">
      <time datetime="2021-09-07">Sep 2021</time>
      <span class="title">Becoming a Father</span>
    </a>
    <a class="post" href="/writing/9">
      <time datetime="2021-08-31">Aug 2021</time>
      <span class="title">Our Actions and Their Long Tail</span>
    </a>
    <a class="post" href="/writing/8">
      <time datetime="2021-08-23">Aug 2021</time>
      <span class="title">Plato's Cave and What It Means For Our Reality</span>
    </a>
    <a class="post" href="/writing/2">
      <time datetime="2021-07-11">Jul 2021</time>
      <span class="title">Sisyphus, the Absurd Hero</span>
    </a>
    <a class="post" href="/writing/1">
      <time datetime="2021-07-05">Jul 2021</time>
      <span class="title">By What Values Shall I Live?</span>
    </a>
  </div>

</main>
</body>
</html>
